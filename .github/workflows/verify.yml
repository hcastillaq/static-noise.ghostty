name: Verify Adapter

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run offline test suite
        run: npm test

      - name: Verify generated theme is fresh
        run: npm run check:generated

      - name: Install Ghostty
        run: brew install --cask ghostty

      - name: Validate Ghostty configuration
        run: /Applications/Ghostty.app/Contents/MacOS/ghostty +validate-config --config-file="dist/Static Noise"
